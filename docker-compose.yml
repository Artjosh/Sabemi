# =============================================================================
# Stack completa: PostgreSQL + API .NET + Worker .NET + Frontend/BFF VINEXT.
#
#   docker compose up --build
#
# A DECISAO DE SEPARACAO
# ----------------------
# A pergunta nao e "quantos containers cabem", e sim "onde a separacao paga o
# proprio custo". Aqui ela paga em tres fronteiras:
#
#   1. API x WORKER - a fronteira mais importante do projeto. A task exige que a
#      regra pesada (~2s) nao bloqueie o webhook. Separar em processos torna isso
#      estrutural e nao apenas assincrono: a API nunca gasta CPU com a regra, os
#      dois lados escalam de forma independente (`--scale worker=3`), e derrubar
#      o worker para um deploy nao derruba a ingestao - os eventos se acumulam na
#      fila e sao processados quando ele volta.
#
#   2. BACKEND x FRONTEND/BFF - sao implementacoes concorrentes do mesmo
#      contrato, em plataformas diferentes. Precisam subir, cair e escalar
#      separadamente para que a troca signifique alguma coisa.
#
#   3. BANCO - stateful, com volume proprio e ciclo de vida distinto do codigo.
#
# O que NAO foi separado, e por que: nao ha gateway/reverse proxy dedicado (o
# route handler do VINEXT ja e o gateway same-origin), nem broker de mensagens
# (a fila e uma tabela, o que permite gravar evento e job na mesma transacao -
# ver Sabemi.Domain/Entities/ProcessingJob.cs), nem um container so para rodar
# migrations (cada backend aplica as suas na subida, o que mantem o `up` como
# unico comando).
# =============================================================================

name: sabemi-webhooks

services:
  # ---------------------------------------------------------------- postgres
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      # `postgres`/`postgres` e nao `sabemi`/`sabemi`: sao os mesmos nomes que o
      # overlay do Supabase usa. Enquanto os dois discordavam, subir a stack sem
      # o overlay criava um banco `sabemi` enquanto os backends conectavam em
      # `postgres` - e o `.env`, que definia os dois valores, escondia isso.
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
    ports:
      # Exposto para inspecionar o banco durante a demonstracao. Em producao
      # esta linha sai: so a rede interna precisa alcancar o PostgreSQL.
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # O MESMO init do overlay do Supabase, e por um motivo pratico: e ele que
      # cria o papel `sabemi_app` e o schema `sabemi`, que os backends usam.
      # Sem esta linha, `docker compose up` sem o overlay subia um banco onde o
      # usuario da aplicacao nao existia - e o README recomendava exatamente
      # esse comando.
      #
      # Os scripts sao idempotentes e o `00-papeis-da-plataforma.sql` cria
      # papeis que so a plataforma usa; num Postgres puro eles ficam ociosos,
      # o que e mais barato do que manter dois conjuntos de init divergindo.
      - ./supabase/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # Os demais servicos aguardam este healthcheck. Sem ele, a API tentaria
      # migrar contra um banco que ainda esta inicializando.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # --------------------------------------------------------------- api .NET
  api:
    build:
      context: ./backend-dotnet
      args:
        APP_PROJECT: Sabemi.Api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      # A MESMA variavel do backend VINEXT. O .NET aceita URL desde
      # PostgresConnectionString: apontar a stack para um Supabase remoto e
      # trocar esta linha no `.env`, e nao transcrever a mesma informacao em duas
      # sintaxes diferentes (uma para cada backend).
      #
      # O default aponta para o servico `postgres` desta stack. Definindo
      # DATABASE_URL no `.env`, ela vence - e e assim que se aponta para remoto.
      DATABASE_URL: ${DATABASE_URL:-postgresql://${APP_DB_USER:-sabemi_app}:${APP_DB_PASSWORD:-sabemi}@postgres:5432/${POSTGRES_DB:-postgres}}

      # SO A API migra o schema `dotnet`. O worker espera. Duas instancias
      # migrando em paralelo disputam o lock de migration do EF Core.
      Database__MigrateOnStartup: "true"

      Jwt__Secret: ${JWT_SECRET:-troque-este-segredo-em-producao-com-no-minimo-32-caracteres}
      Auth__PublicBaseUrl: ${API_PUBLIC_URL:-http://localhost:8080}

      # ------------------------------------------- provedor de identidade
      #
      # `local`    (padrao) magic link e OTP proprios, com hash no banco
      # `supabase` o GoTrue emite, envia e valida o desafio de acesso
      #
      # Em AMBOS os modos o pedido de login (selector + polling) e local: e ele
      # que da o cross-device, e o GoTrue nao tem esse conceito.
      #
      # No modo `supabase`, suba tambem o overlay da plataforma:
      #   docker compose -f docker-compose.yml -f docker-compose.supabase.yml up -d
      AUTH_PROVIDER: ${AUTH_PROVIDER:-local}
      Supabase__Url: ${SUPABASE_URL:-}
      Supabase__AnonKey: ${SUPABASE_ANON_KEY:-}

      # E-mail de acesso pela Brevo. A MESMA conta que o backend VINEXT usa: o
      # e-mail e o mesmo produto, venha de qual backend vier, e duas contas
      # dariam duas reputacoes de envio a cuidar.
      #
      # Chave vazia = sem envio real, e o link de acesso vai para o log. E o que
      # permite avaliar o projeto sem uma conta na Brevo.
      Brevo__ApiKey: ${BREVO_API_KEY:-}
      Brevo__SenderEmail: ${BREVO_SENDER_EMAIL:-nao-responda@sabemi.com.br}
      Brevo__SenderName: ${BREVO_SENDER_NAME:-Sabemi}

      # Tracing. Sem endpoint configurado, o tracing nao sobe; `/metrics`
      # continua de pe de qualquer forma.
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_SERVICE_NAMESPACE: ${OTEL_SERVICE_NAMESPACE:-sabemi}

      WebhookSecurity__ApiKey: ${WEBHOOK_API_KEY:-sabemi-dev-api-key}
      WebhookSecurity__SignatureSecret: ${WEBHOOK_SIGNATURE_SECRET:-sabemi-dev-signature-secret}
      WebhookSecurity__RequireSignature: ${WEBHOOK_REQUIRE_SIGNATURE:-false}

      Cors__AllowedOrigins__0: ${FRONTEND_PUBLIC_URL:-http://localhost:3000}

      # Pedidos de login por minuto, por IP. O padrao e o valor de producao.
      # A suite ponta a ponta sobe a stack com um teto maior: ela faz dezenas
      # de logins do mesmo IP em segundos (ver tests/e2e/README.md).
      RateLimit__AuthPermitLimit: ${AUTH_RATE_LIMIT:-10}
    ports:
      # `/metrics` sai na MESMA porta da API: ele e um endpoint do ASP.NET, e nao
      # um listener separado como no worker.
      - "${API_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ------------------------------------------------------------ worker .NET
  worker:
    build:
      context: ./backend-dotnet
      args:
        APP_PROJECT: Sabemi.Worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      api:
        # Espera a API terminar as migrations. O worker tem a propria espera
        # (ver Sabemi.Worker/Program.cs), mas comecar na ordem certa evita
        # dezenas de linhas de "aguardando o schema" no log da primeira subida.
        condition: service_healthy
    environment:
      DOTNET_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      # A MESMA variavel do backend VINEXT. O .NET aceita URL desde
      # PostgresConnectionString: apontar a stack para um Supabase remoto e
      # trocar esta linha no `.env`, e nao transcrever a mesma informacao em duas
      # sintaxes diferentes (uma para cada backend).
      #
      # O default aponta para o servico `postgres` desta stack. Definindo
      # DATABASE_URL no `.env`, ela vence - e e assim que se aponta para remoto.
      DATABASE_URL: ${DATABASE_URL:-postgresql://${APP_DB_USER:-sabemi_app}:${APP_DB_PASSWORD:-sabemi}@postgres:5432/${POSTGRES_DB:-postgres}}

      Database__MigrateOnStartup: "false"

      Jwt__Secret: ${JWT_SECRET:-troque-este-segredo-em-producao-com-no-minimo-32-caracteres}

      # A regra pesada exigida pela task. Este e o tempo que o webhook NAO paga.
      Processing__SimulatedWorkMs: ${PROCESSING_SIMULATED_WORK_MS:-2000}
      Processing__BatchSize: ${PROCESSING_BATCH_SIZE:-10}
      Processing__MaxTentativas: ${PROCESSING_MAX_ATTEMPTS:-3}

      # Tracing. Sem endpoint configurado, o tracing simplesmente nao sobe - a
      # stack continua funcionando sem um coletor no ar.
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_SERVICE_NAMESPACE: ${OTEL_SERVICE_NAMESPACE:-sabemi}
      Metrics__Port: "9464"

    ports:
      # A UNICA porta do worker, e ela nao atende requisicao de negocio: e o
      # `/metrics` que o Prometheus raspa. E aqui que a regra pesada roda, e uma
      # fila que parou de drenar so aparece nesta metrica - o webhook continua
      # respondendo 202 enquanto nada e processado.
      #
      # Ao escalar (`--scale worker=3`), remova o mapeamento fixo: varias
      # replicas nao podem disputar a mesma porta do host. Em producao quem
      # descobre as replicas e o service discovery do Prometheus.
      - "${WORKER_METRICS_PORT:-9464}:9464"

    # Escale com:  docker compose up -d --scale worker=3 (veja a nota acima)
    # As replicas nao brigam pelos mesmos itens - a reivindicacao usa
    # FOR UPDATE SKIP LOCKED (ver Infrastructure/Queue/PostgresJobQueue.cs).

  # --------------------------------------------------- frontend + BFF VINEXT
  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      api:
        # A API e dona das migrations do schema compartilhado. O BFF le as
        # mesmas tabelas, entao precisa esperar elas existirem.
        condition: service_healthy
    environment:
      # O VINEXT so serve a build otimizada em `production`. Isso NAO significa
      # que esta stack e um ambiente de producao - ver AUTH_EXPOSE_LOGIN_CODES
      # logo abaixo.
      NODE_ENV: production

      # Esta e a stack de demonstracao do teste tecnico e nao tem provedor de
      # e-mail configurado por padrao. Sem isto, `NODE_ENV=production` desligaria
      # a entrega do link/OTP na resposta e nao sobraria caminho algum para
      # entrar. `docker-compose.prod.yml` fixa "false" e exige e-mail de verdade.
      AUTH_EXPOSE_LOGIN_CODES: ${AUTH_EXPOSE_LOGIN_CODES:-true}

      # Os DOIS backends usam o mesmo banco e o mesmo schema `sabemi` - e o que
      # faz o dado aparecer nos dois sem novo login. As migrations sao da API
      # .NET; o entrypoint apenas espera as tabelas existirem.
      #
      # Sem `?schema=`: o Prisma qualifica cada tabela pelo `@@schema` do modelo,
      # e o driver `pg` interpretava esse parametro como o USUARIO da conexao.
      DATABASE_URL: ${DATABASE_URL:-postgresql://${APP_DB_USER:-sabemi_app}:${APP_DB_PASSWORD:-sabemi}@postgres:5432/${POSTGRES_DB:-postgres}}

      # Como o SERVIDOR do VINEXT alcanca o backend .NET. Nome de servico, nao
      # localhost: quem faz esta chamada e o container, nao o browser.
      DOTNET_API_URL: http://api:8080

      # Base publica para montar o link de confirmacao do e-mail - precisa ser
      # alcancavel pelo NAVEGADOR, inclusive de outro aparelho.
      BFF_PUBLIC_BASE_URL: ${FRONTEND_PUBLIC_URL:-http://localhost:3000}

      # O mesmo segredo da API: e o que permite ao gateway aceitar uma sessao
      # emitida por qualquer um dos dois backends.
      JWT_SECRET: ${JWT_SECRET:-troque-este-segredo-em-producao-com-no-minimo-32-caracteres}

      WEBHOOK_API_KEY: ${WEBHOOK_API_KEY:-sabemi-dev-api-key}
      WEBHOOK_SIGNATURE_SECRET: ${WEBHOOK_SIGNATURE_SECRET:-sabemi-dev-signature-secret}
      WEBHOOK_REQUIRE_SIGNATURE: ${WEBHOOK_REQUIRE_SIGNATURE:-false}

      PROCESSING_SIMULATED_WORK_MS: ${PROCESSING_SIMULATED_WORK_MS:-2000}

      # Provedor de identidade - o MESMO modo da API .NET. Os dois backends
      # compartilham a tabela de pedidos de login, entao rodar em modos
      # diferentes faria um deles nao conseguir validar o pedido criado pelo
      # outro. (O `provedor` gravado na linha impede que isso corrompa algo: o
      # pedido e simplesmente recusado - ver IdentityProvider.)
      AUTH_PROVIDER: ${AUTH_PROVIDER:-local}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-}

      # E-mail de acesso pela Brevo - a MESMA conta e o MESMO remetente da API
      # .NET. Chave vazia = sem envio real, e o link vai para o log.
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      BREVO_SENDER_EMAIL: ${BREVO_SENDER_EMAIL:-nao-responda@sabemi.com.br}
      BREVO_SENDER_NAME: ${BREVO_SENDER_NAME:-Sabemi}

      # Tracing. Sem endpoint configurado, o tracing nao sobe e a stack continua
      # funcionando sem um coletor no ar.
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_SERVICE_NAMESPACE: ${OTEL_SERVICE_NAMESPACE:-sabemi}
      METRICS_PORT: "9464"
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
      # `/metrics` em porta separada, e nao em `/api/bff/metrics`: o exportador
      # Prometheus precisa de um coletor de longa duracao, e o VINEXT executa os
      # handlers em contexto por requisicao.
      - "${BFF_METRICS_PORT:-9465}:9464"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/bff/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ---------------------------------------------------------------- tracing
  #
  # Jaeger: coletor OTLP + interface para ler os traces.
  #
  # <b>Sob um profile, e nao junto com o resto.</b> A stack precisa subir com um
  # comando so para a avaliacao do teste, e um container a mais que ninguem vai
  # abrir e memoria gasta a toa. Nada depende dele: sem `OTEL_EXPORTER_OTLP_ENDPOINT`
  # configurado, os tres servicos simplesmente nao ligam o tracing.
  #
  #   docker compose --profile observabilidade up -d
  #   # e no .env:  OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318
  #
  # Interface em http://localhost:16686
  #
  # <b>4318, e nao 4317.</b> 4317 e OTLP/gRPC; 4318 e OTLP/HTTP. O backend .NET
  # aceita os dois, mas o exportador do BFF (`exporter-trace-otlp-http`) so fala
  # HTTP - apontar para 4317 faz os traces do VINEXT sumirem em silencio, porque
  # o exportador falha em segundo plano e nao derruba nada.
  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    profiles: ["observabilidade"]
    restart: unless-stopped
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "${JAEGER_UI_PORT:-16686}:16686"
      # Nao publicadas no host: quem entrega trace sao os containers, pela rede
      # interna. Abri-las so aumentaria a superficie exposta.
      #  - 4317 (OTLP/gRPC), 4318 (OTLP/HTTP)
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:16686/ >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  postgres_data:
    driver: local
