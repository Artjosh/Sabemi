# =============================================================================
# Integracao continua.
#
# ESTRUTURA
# ---------
# Quatro jobs independentes que rodam em paralelo, mais um portao final:
#
#   backend-dotnet  - build, testes (unidade + integracao) e limiar de cobertura
#   frontend        - typecheck, testes (node + browser) e limiar de cobertura
#   contract        - valida o OpenAPI compartilhado pelos dois backends
#   docker          - constroi as imagens (so em push, nao em PR de fork)
#   ci              - portao unico que agrega o resultado
#
# O portao final existe para a protecao de branch precisar de UM status
# obrigatorio em vez de uma lista que precisa ser atualizada a cada job novo -
# e cuja desatualizacao passa despercebida.
# =============================================================================

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Um push novo cancela a execucao anterior do mesmo branch: nao ha razao para
# gastar minutos validando um commit que ja foi substituido.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_VERSION: "10.0.x"
  NODE_VERSION: "24"
  # Limiar exigido pela especificacao. O pipeline FALHA abaixo dele.
  COVERAGE_MIN: "80"

permissions:
  contents: read

jobs:
  # ------------------------------------------------------------ backend .NET
  backend-dotnet:
    name: Backend .NET
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: backend-dotnet

    steps:
      - uses: actions/checkout@v4

      - name: Configura o .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache dos pacotes NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('backend-dotnet/**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restaura as dependencias
        run: dotnet restore Sabemi.slnx

      # `TreatWarningsAsErrors` no CI: um aviso que passa despercebido localmente
      # vira erro aqui, antes de chegar ao main.
      - name: Compila
        run: dotnet build Sabemi.slnx --configuration Release --no-restore /p:TreatWarningsAsErrors=true

      - name: Verifica a formatacao
        run: dotnet format Sabemi.slnx --verify-no-changes --severity error
        continue-on-error: true

      # Os testes de integracao sobem um PostgreSQL real via Testcontainers. O
      # runner do GitHub ja tem Docker, e nada precisa ser declarado como
      # `services` - a propria suite gerencia o ciclo de vida do container.
      - name: Testes com cobertura
        run: |
          dotnet test Sabemi.slnx \
            --configuration Release \
            --no-build \
            --settings coverlet.runsettings \
            --results-directory TestResults \
            --logger "trx;LogFileName=resultados.trx" \
            --logger "console;verbosity=normal"

      - name: Portao de cobertura (minimo ${{ env.COVERAGE_MIN }}%)
        run: python scripts/check-coverage.py TestResults --min ${{ env.COVERAGE_MIN }}

      # `backend-dotnet/schema.sql` e versionado porque quem trabalha no
      # frontend precisa criar o banco de teste sem ter o SDK do .NET instalado
      # (ver frontend/scripts/setup-test-db.mjs). Um arquivo versionado que
      # ninguem verifica envelhece em silencio: no dia em que alguem adiciona
      # uma migration e esquece de regenera-lo, a suite do frontend passa a
      # rodar contra um schema que nao existe mais.
      - name: Instala as ferramentas locais (dotnet-ef)
        run: dotnet tool restore

      - name: O schema.sql versionado esta atualizado?
        run: |
          dotnet ef migrations script --idempotent             --project src/Sabemi.Infrastructure             --startup-project src/Sabemi.Infrastructure             --output /tmp/schema-regerado.sql

          # `--strip-trailing-cr` porque o arquivo versionado nasce no Windows.
          if ! diff --strip-trailing-cr -q schema.sql /tmp/schema-regerado.sql; then
            echo "::error::schema.sql esta desatualizado. Regenere com:"
            echo "  cd backend-dotnet && dotnet tool restore && dotnet ef migrations script --idempotent --project src/Sabemi.Infrastructure --startup-project src/Sabemi.Infrastructure --output schema.sql"
            diff --strip-trailing-cr schema.sql /tmp/schema-regerado.sql | head -40
            exit 1
          fi

      - name: Publica os artefatos de teste
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-test-results
          path: backend-dotnet/TestResults/
          retention-days: 7

  # --------------------------------------------------------------- frontend
  frontend:
    name: Frontend + BFF VINEXT
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: frontend

    # Os testes rodam contra PostgreSQL de verdade - e o unico jeito de exercitar
    # o indice unico que garante a idempotencia e o SKIP LOCKED que move a fila.
    # O schema e o `sabemi`, o mesmo do backend .NET: e o compartilhamento que
    # faz um evento entregue a um backend aparecer no painel do outro.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: sabemi
          POSTGRES_PASSWORD: sabemi
          POSTGRES_DB: sabemi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sabemi"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://sabemi:sabemi@localhost:5432/sabemi_test
      JWT_SECRET: segredo-de-teste-com-mais-de-32-caracteres-aqui
      WEBHOOK_API_KEY: chave-de-teste
      WEBHOOK_SIGNATURE_SECRET: segredo-de-teste

    steps:
      - uses: actions/checkout@v4

      - name: Configura o pnpm
        uses: pnpm/action-setup@v4

      - name: Configura o Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Instala as dependencias
        run: pnpm install --frozen-lockfile

      - name: Gera o cliente do Prisma
        run: pnpm prisma generate

      # NAO ha `prisma migrate deploy` aqui, e isso e deliberado: nao existe
      # pasta de migrations do Prisma. Quem cria e evolui o schema `sabemi` e o
      # EF Core; o Prisma apenas o DESCREVE para poder consultar. Duas
      # ferramentas emitindo DDL para as mesmas tabelas produziriam exatamente o
      # tipo de divergencia silenciosa que o passo de drift abaixo existe para
      # impedir.
      #
      # O que este passo aplica e `backend-dotnet/schema.sql`, gerado pelo EF
      # Core e verificado no job do .NET.
      - name: Prepara o banco de teste (schema do EF Core)
        run: pnpm db:test:setup

      # O modelo do Prisma descreve o mesmo schema que o EF Core cria. Se as
      # duas descricoes divergirem, o backend VINEXT le colunas que nao existem
      # - e o erro so apareceria em runtime, no container, longe da causa.
      - name: O modelo do Prisma corresponde ao banco?
        run: pnpm db:check

      - name: Verificacao de tipos
        run: pnpm typecheck

      - name: Testes com cobertura
        run: pnpm test:coverage

      # O build de producao entra no CI de proposito: erros de RSC e de
      # empacotamento so aparecem aqui, e nao no modo de desenvolvimento.
      - name: Build de producao
        run: pnpm build

      - name: Publica o relatorio de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage/
          retention-days: 7

  # ---------------------------------------------------------------- contrato
  contract:
    name: Contrato OpenAPI
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Configura o Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # O contrato e a fonte de verdade do acordo entre os dois backends. Um
      # YAML quebrado passaria despercebido ate alguem tentar gerar um cliente a
      # partir dele.
      - name: Valida contracts/openapi.yaml
        run: npx --yes @redocly/cli@latest lint contracts/openapi.yaml --format stylish
        continue-on-error: true

      - name: Verifica que o YAML e sintaticamente valido
        run: |
          python -c "
          import sys, yaml
          with open('contracts/openapi.yaml') as f:
              doc = yaml.safe_load(f)
          assert doc['openapi'].startswith('3.'), 'versao OpenAPI inesperada'
          caminhos = set(doc['paths'])
          exigidos = {'/webhooks/pagamento', '/auth/magic-link', '/auth/login-status', '/payments'}
          faltando = exigidos - caminhos
          assert not faltando, f'contrato sem os caminhos obrigatorios: {faltando}'
          print(f'Contrato valido: {len(caminhos)} caminhos declarados.')
          "

  # ------------------------------------------------------------------ docker
  docker:
    name: Imagens Docker + E2E
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - name: Configura o Buildx
        uses: docker/setup-buildx-action@v3

      # As imagens sao construidas e verificadas, mas nao publicadas aqui - a
      # publicacao acontece no workflow de deploy, apos os testes passarem.
      - name: Imagem da API .NET
        uses: docker/build-push-action@v6
        with:
          context: ./backend-dotnet
          build-args: APP_PROJECT=Sabemi.Api
          push: false
          load: true
          tags: sabemi/api:ci
          cache-from: type=gha,scope=dotnet
          cache-to: type=gha,scope=dotnet,mode=max

      - name: Imagem do Worker .NET
        uses: docker/build-push-action@v6
        with:
          context: ./backend-dotnet
          build-args: APP_PROJECT=Sabemi.Worker
          push: false
          load: true
          tags: sabemi/worker:ci
          # Mesmo escopo de cache da API: os dois compartilham restore e build.
          cache-from: type=gha,scope=dotnet
          cache-to: type=gha,scope=dotnet,mode=max

      - name: Imagem do Frontend/BFF
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          load: true
          tags: sabemi/frontend:ci
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

      # Construir nao prova que a imagem SOBE. Os dois passos abaixo levantam a
      # stack inteira e a exercitam de verdade.
      - name: Sobe a stack
        env:
          # Teto de login maior que o de producao: a suite ponta a ponta faz
          # dezenas de autenticacoes do mesmo IP em segundos, e o limite real
          # (10/min) a derrubaria por estar funcionando corretamente.
          AUTH_RATE_LIMIT: "500"
        run: docker compose up -d --wait --wait-timeout 240

      # Verificacao rapida: se algo obvio estiver quebrado, falha aqui em
      # segundos em vez de esperar a suite completa.
      - name: Teste de fumaca
        run: bash scripts/smoke-test.sh

      - name: Configura o pnpm
        uses: pnpm/action-setup@v4

      - name: Configura o Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Instala as dependencias do E2E
        working-directory: tests/e2e
        run: pnpm install --no-frozen-lockfile

      # A suite que atravessa a fiacao real: containers separados, rede do
      # Docker, migrations no entrypoint, worker em outro processo. E o unico
      # nivel que pega variavel de ambiente com nome errado ou serviço apontando
      # para localhost.
      - name: Testes ponta a ponta
        working-directory: tests/e2e
        run: pnpm test

      - name: Logs em caso de falha
        if: failure()
        run: docker compose logs --tail 150

      - name: Derruba a stack
        if: always()
        run: docker compose down -v

  # ------------------------------------------------------------------ portao
  ci:
    name: CI
    runs-on: ubuntu-latest
    needs: [backend-dotnet, frontend, contract, docker]
    if: always()

    steps:
      # `needs.*.result` inclui 'skipped' e 'cancelled'. Exigir 'success' de
      # todos evita o modo de falha classico: um job pulado por engano deixando o
      # portao verde.
      - name: Verifica o resultado de todos os jobs
        run: |
          echo "backend-dotnet : ${{ needs.backend-dotnet.result }}"
          echo "frontend       : ${{ needs.frontend.result }}"
          echo "contract       : ${{ needs.contract.result }}"
          echo "docker         : ${{ needs.docker.result }}"

          if [ "${{ needs.backend-dotnet.result }}" != "success" ] \
          || [ "${{ needs.frontend.result }}" != "success" ] \
          || [ "${{ needs.contract.result }}" != "success" ] \
          || [ "${{ needs.docker.result }}" != "success" ]; then
            echo "::error::Um ou mais jobs falharam."
            exit 1
          fi

          echo "Todos os jobs passaram."
